<svg viewBox="785 132 982 634" xmlns="http://www.w3.org/2000/svg" width="982" height="634">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="glassBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5bff"/><stop offset="1" stop-color="#8a3ff0"/>
    </linearGradient>
    <filter id="dropWin" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#2a1a6b" flood-opacity="0.34"/>
    </filter>
    <filter id="dropTile" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#241562" flood-opacity="0.38"/>
    </filter>
    <clipPath id="winClip"><rect x="1060" y="212" width="566" height="474" rx="18"/></clipPath>
  </defs>

  <!-- ===== dashed connectors (behind window) ===== -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.85">
    <path d="M812 548 H884 a14 14 0 0 0 14 -14 V420 a14 14 0 0 1 14 -14 H978"/>
    <path d="M1636 470 h70 a14 14 0 0 0 14 -14 V372 a14 14 0 0 0 -14 -14 h-60"/>
  </g>
  <g fill="#ffffff">
    <circle cx="812" cy="548" r="5.5"/><circle cx="812" cy="548" r="12" opacity="0.3"/>
    <circle cx="1720" cy="372" r="5.5"/><circle cx="1720" cy="372" r="12" opacity="0.3"/>
  </g>

  <!-- ===== main frosted window ===== -->
  <g filter="url(#dropWin)">
    <rect x="1060" y="212" width="566" height="474" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#winClip)">
    <!-- title bar -->
    <rect x="1060" y="212" width="566" height="50" fill="url(#glassBar)"/>
    <circle cx="1088" cy="237" r="5.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="1106" cy="237" r="5.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="1124" cy="237" r="5.5" fill="#ffffff" opacity="0.65"/>
    <rect x="1548" y="233" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.8"/>
    <rect x="1572" y="233" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.8"/>
    <rect x="1596" y="233" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- center image placeholder -->
    <rect x="1214" y="300" width="196" height="150" rx="12" fill="#ffffff" opacity="0.5"/>
    <circle cx="1262" cy="342" r="16" fill="#ffffff" opacity="0.85"/>
    <path d="M1230 430 l44 -46 32 34 26 -22 40 34 z" fill="#ffffff" opacity="0.85"/>
    <!-- center bullet list -->
    <g fill="#ffffff">
      <circle cx="1222" cy="472" r="5" opacity="0.9"/><rect x="1236" y="467" width="120" height="10" rx="5" opacity="0.7"/>
      <circle cx="1222" cy="496" r="5" opacity="0.7"/><rect x="1236" y="491" width="150" height="10" rx="5" opacity="0.5"/>
    </g>

    <!-- right column cards -->
    <g>
      <rect x="1446" y="298" width="150" height="70" rx="10" fill="#ffffff" opacity="0.5"/>
      <rect x="1462" y="316" width="120" height="8" rx="4" fill="#ffffff" opacity="0.8"/>
      <rect x="1462" y="332" width="96" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
      <rect x="1462" y="348" width="108" height="8" rx="4" fill="#ffffff" opacity="0.5"/>

      <rect x="1446" y="384" width="150" height="70" rx="10" fill="#ffffff" opacity="0.5"/>
      <circle cx="1470" cy="419" r="14" fill="#ffffff" opacity="0.85"/>
      <rect x="1494" y="406" width="88" height="8" rx="4" fill="#ffffff" opacity="0.75"/>
      <rect x="1494" y="422" width="70" height="8" rx="4" fill="#ffffff" opacity="0.55"/>

      <rect x="1446" y="470" width="150" height="88" rx="10" fill="#ffffff" opacity="0.5"/>
      <circle cx="1470" cy="500" r="14" fill="#ffffff" opacity="0.85"/>
      <rect x="1494" y="488" width="88" height="8" rx="4" fill="#ffffff" opacity="0.75"/>
      <rect x="1494" y="504" width="70" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
      <rect x="1462" y="528" width="120" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- bottom-left small bars -->
    <g fill="#ffffff">
      <rect x="1108" y="536" width="96" height="9" rx="4.5" opacity="0.55"/>
      <rect x="1108" y="556" width="70" height="9" rx="4.5" opacity="0.4"/>
    </g>
    <!-- bottom hexagon pill -->
    <rect x="1214" y="548" width="150" height="46" rx="12" fill="#ffffff" opacity="0.92"/>
    <path d="M1246 555 l16 9 v18 l-16 9 -16 -9 v-18 z" fill="url(#hex)"/>
    <circle cx="1246" cy="573" r="5.5" fill="#ffffff"/>
    <rect x="1276" y="565" width="70" height="8" rx="4" fill="#6d5bff" opacity="0.6"/>
    <rect x="1276" y="578" width="52" height="8" rx="4" fill="#6d5bff" opacity="0.4"/>
  </g>

  <!-- ===== floating code card (top-left of window) ===== -->
  <g filter="url(#dropTile)">
    <rect x="978" y="300" width="188" height="196" rx="16" fill="#ffffff" fill-opacity="0.95"/>
  </g>
  <!-- code icon -->
  <g stroke="#5b4ff0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1018 332 l-16 14 16 14"/>
    <path d="M1052 332 l16 14 -16 14"/>
    <path d="M1042 326 l-14 40"/>
  </g>
  <g fill="#5b4ff0">
    <circle cx="1004" cy="398" r="5"/><rect x="1018" y="393" width="120" height="10" rx="5" opacity="0.65"/>
    <circle cx="1004" cy="424" r="5"/><rect x="1018" y="419" width="96" height="10" rx="5" opacity="0.5"/>
    <circle cx="1004" cy="450" r="5"/><rect x="1018" y="445" width="112" height="10" rx="5" opacity="0.4"/>
  </g>

  <!-- ===== person tile (lower-left) ===== -->
  <g filter="url(#dropTile)">
    <rect x="972" y="520" width="100" height="100" rx="18" fill="#ffffff" fill-opacity="0.96"/>
  </g>
  <g fill="#5b4ff0">
    <circle cx="1022" cy="556" r="15"/>
    <path d="M994 600 a28 26 0 0 1 56 0 z"/>
  </g>

  <!-- ===== gear tile (lower-right) ===== -->
  <g filter="url(#dropTile)">
    <rect x="1612" y="530" width="100" height="100" rx="18" fill="#ffffff" fill-opacity="0.96"/>
  </g>
  <g transform="translate(1662,580)" fill="#5b4ff0">
    <g>
      <rect x="-6" y="-34" width="12" height="12" rx="3"/><rect x="-6" y="22" width="12" height="12" rx="3"/>
      <rect x="-34" y="-6" width="12" height="12" rx="3"/><rect x="22" y="-6" width="12" height="12" rx="3"/>
      <rect x="-27" y="-27" width="12" height="12" rx="3" transform="rotate(45)"/>
      <rect x="-27" y="15" width="12" height="12" rx="3" transform="rotate(45)"/>
      <rect x="15" y="-27" width="12" height="12" rx="3" transform="rotate(45)"/>
      <rect x="15" y="15" width="12" height="12" rx="3" transform="rotate(45)"/>
    </g>
    <circle cx="0" cy="0" r="22"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
  </g>
</svg>
