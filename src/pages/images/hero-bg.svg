<svg viewBox="0 0 2000 1022" xmlns="http://www.w3.org/2000/svg" width="2000" height="1022" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#14209E"/>
      <stop offset="45%" stop-color="#2A3FE0"/>
      <stop offset="72%" stop-color="#7C4FE0"/>
      <stop offset="100%" stop-color="#D26BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="1" r="0.4">
      <stop offset="0%" stop-color="#B9C6FF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#B9C6FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#B9C6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#ffffff" opacity="0.55"/>
    </pattern>
    <linearGradient id="dotsFadeTL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dotsFadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskTL">
      <rect x="0" y="0" width="420" height="340" fill="url(#dotsFadeTL)"/>
    </mask>
    <mask id="maskR">
      <rect x="1740" y="0" width="260" height="1022" fill="url(#dotsFadeR)"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="2000" height="1022" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="2000" height="1022" fill="url(#glow)"/>

  <rect x="0" y="0" width="420" height="340" fill="url(#dots)" mask="url(#maskTL)"/>
  <rect x="1740" y="0" width="260" height="1022" fill="url(#dots)" mask="url(#maskR)"/>
</svg>
