<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The UXP Developer Tool in dark mode with Photoshop, Premiere Pro, and InDesign connected and a Create Plugin button">
  <defs>
    <filter id="uxpSoft" x="-25%" y="-25%" width="155%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0A0420" flood-opacity="0.40"/>
    </filter>
    <clipPath id="uxpWin"><rect x="60" y="68" width="680" height="464" rx="18"/></clipPath>
  </defs>

  <!-- 3D extrusion: darker back face offset toward bottom-right, with a soft ground shadow -->
  <g filter="url(#uxpSoft)">
    <rect x="86" y="94" width="680" height="464" rx="18" fill="#0A0910"/>
  </g>

  <!-- front face -->
  <rect x="60" y="68" width="680" height="464" rx="18" fill="#141416"/>

  <g clip-path="url(#uxpWin)">
    <!-- title bar -->
    <rect x="60" y="68" width="680" height="46" fill="#131315"/>
    <circle cx="90" cy="91" r="5.5" fill="#FF5F57"/>
    <circle cx="109" cy="91" r="5.5" fill="#FEBC2E"/>
    <circle cx="128" cy="91" r="5.5" fill="#28C840"/>
    <text x="168" y="97" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F2F2F4">Developer Workspace</text>
    <rect x="168" y="108" width="156" height="2" rx="1" fill="#F2F2F4"/>
    <text x="348" y="97" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#8B8B92">Playground</text>
    <line x1="60" y1="114" x2="740" y2="114" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- left icon rail -->
    <rect x="60" y="114" width="36" height="418" fill="#0E0E10"/>
    <g fill="#6A6A72">
      <circle cx="72" cy="134" r="1.6"/><circle cx="78" cy="134" r="1.6"/><circle cx="84" cy="134" r="1.6"/>
      <circle cx="72" cy="140" r="1.6"/><circle cx="78" cy="140" r="1.6"/><circle cx="84" cy="140" r="1.6"/>
      <circle cx="72" cy="146" r="1.6"/><circle cx="78" cy="146" r="1.6"/><circle cx="84" cy="146" r="1.6"/>
    </g>
    <rect x="72" y="162" width="12" height="15" rx="2" fill="none" stroke="#6A6A72" stroke-width="1.4"/>
    <circle cx="78" cy="500" r="6.5" fill="none" stroke="#6A6A72" stroke-width="1.4"/>
    <circle cx="78" cy="521" r="6.5" fill="none" stroke="#6A6A72" stroke-width="1.4"/>
    <text x="78" y="524.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" fill="#6A6A72" text-anchor="middle">?</text>
    <line x1="96" y1="114" x2="96" y2="532" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <!-- sidebar -->
    <rect x="96" y="114" width="176" height="418" fill="#17171A"/>
    <line x1="272" y1="114" x2="272" y2="532" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="116" y="144" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="1" fill="#77777E">CONNECTED APPS</text>

    <!-- app card: Photoshop -->
    <rect x="110" y="154" width="150" height="80" rx="10" fill="#1E1E22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M118 172 L122 176 L126 172" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="162" width="26" height="26" rx="7" fill="#001E36" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#31A8FF" text-anchor="middle">Ps</text>
    <text x="170" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#EFEFF2">Photoshop</text>
    <text x="170" y="188" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#9A9AA0">v27.9.1</text>
    <rect x="122" y="200" width="126" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="185" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#B8B8BE" text-anchor="middle">Debug Script</text>

    <!-- app card: Premiere Pro -->
    <rect x="110" y="244" width="150" height="80" rx="10" fill="#1E1E22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M118 262 L122 266 L126 262" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="252" width="26" height="26" rx="7" fill="#2A0634" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#EA77FF" text-anchor="middle">Pr</text>
    <text x="170" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#EFEFF2">Premiere Pro</text>
    <text x="170" y="278" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#9A9AA0">v26.3.0</text>
    <rect x="122" y="290" width="126" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="185" y="305" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#B8B8BE" text-anchor="middle">Debug Script</text>

    <!-- app card: InDesign -->
    <rect x="110" y="334" width="150" height="80" rx="10" fill="#1E1E22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M118 352 L122 356 L126 352" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="342" width="26" height="26" rx="7" fill="#310015" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF3366" text-anchor="middle">Id</text>
    <text x="170" y="354" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#EFEFF2">InDesign</text>
    <text x="170" y="368" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#9A9AA0">v21.4.1</text>
    <rect x="122" y="380" width="126" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="185" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#B8B8BE" text-anchor="middle">Debug Script</text>

    <!-- main empty state -->
    <g fill="#5E5E66">
      <rect x="498" y="214" width="8" height="18" rx="4"/>
      <rect x="515" y="214" width="8" height="18" rx="4"/>
      <rect x="486" y="230" width="48" height="34" rx="14"/>
      <rect x="505" y="262" width="8" height="22" rx="4"/>
    </g>
    <text x="510" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F2F4" text-anchor="middle">Add Plugins to your Workspace</text>
    <text x="510" y="352" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA0" text-anchor="middle">Load and debug your plugins in development.</text>

    <rect x="364" y="384" width="130" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="429" y="411" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#EDECEF" text-anchor="middle">Add Plugin</text>
    <rect x="508" y="384" width="148" height="44" rx="22" fill="#2680EB"/>
    <text x="582" y="411" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create Plugin</text>
  </g>

  <!-- crisp frame -->
  <rect x="60" y="68" width="680" height="464" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- pointer on Create Plugin -->
  <g transform="translate(624,422)">
    <path d="M0 0 L0 18 L5 13 L8.5 20 L11 18.8 L7.6 12 L13 12 Z" fill="#FFFFFF" stroke="#050110" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</svg>
