<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the UXP Developer Tool with Photoshop, Premiere, InDesign, and Media Encoder connected and a Create Plugin button">
  <defs>
    <filter id="uxpSoft" x="-25%" y="-25%" width="155%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1C0F42" flood-opacity="0.35"/>
    </filter>
    <clipPath id="uxpWin"><rect x="60" y="68" width="680" height="464" rx="18"/></clipPath>
  </defs>

  <g transform="translate(-33 -25) scale(1.08)">
  <!-- 3D extrusion: darker back face offset toward bottom-right, with a soft ground shadow -->
  <g filter="url(#uxpSoft)">
    <rect x="86" y="94" width="680" height="464" rx="18" fill="#170B34"/>
  </g>

  <!-- front face -->
  <rect x="60" y="68" width="680" height="464" rx="18" fill="#241454"/>

  <g clip-path="url(#uxpWin)">
    <!-- title bar -->
    <rect x="60" y="68" width="680" height="46" fill="#1C0F42"/>
    <text x="90" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F2F2F4">Developer Workspace</text>
    <rect x="90" y="108" width="188" height="2" rx="1" fill="#F2F2F4"/>
    <text x="300" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8B8B92">Playground</text>
    <line x1="60" y1="114" x2="740" y2="114" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- left icon rail -->
    <rect x="60" y="114" width="36" height="418" fill="#190D3A"/>
    <g fill="#6A6A72">
      <circle cx="72" cy="134" r="2"/><circle cx="78" cy="134" r="2"/><circle cx="84" cy="134" r="2"/>
      <circle cx="72" cy="140" r="2"/><circle cx="78" cy="140" r="2"/><circle cx="84" cy="140" r="2"/>
      <circle cx="72" cy="146" r="2"/><circle cx="78" cy="146" r="2"/><circle cx="84" cy="146" r="2"/>
    </g>
    <rect x="72" y="162" width="12" height="15" rx="2" fill="none" stroke="#6A6A72" stroke-width="1.4"/>
    <circle cx="78" cy="500" r="6.5" fill="none" stroke="#6A6A72" stroke-width="1.4"/>
    <circle cx="78" cy="521" r="6.5" fill="none" stroke="#6A6A72" stroke-width="1.4"/>
    <text x="78" y="524.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" fill="#6A6A72" text-anchor="middle">?</text>
    <line x1="96" y1="114" x2="96" y2="532" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <!-- sidebar -->
    <rect x="96" y="114" width="200" height="418" fill="#2B1A5E"/>
    <line x1="296" y1="114" x2="296" y2="532" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="116" y="144" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="0.6" fill="#8F8F96">CONNECTED APPS</text>

    <!-- app card: Photoshop -->
    <rect x="110" y="154" width="174" height="80" rx="10" fill="#34216E" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M118 172 L122 176 L126 172" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="162" width="26" height="26" rx="7" fill="#001E36" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#31A8FF" text-anchor="middle">Ps</text>
    <text x="170" y="176" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#DADADF">Photoshop</text>
    <text x="170" y="192" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#AFAFB5">vX.Y.Z</text>
    <rect x="122" y="200" width="150" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="197" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#92929A" text-anchor="middle">Debug Script</text>

    <!-- app card: Premiere -->
    <rect x="110" y="244" width="174" height="80" rx="10" fill="#34216E" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M118 262 L122 266 L126 262" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="252" width="26" height="26" rx="7" fill="#2A0634" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#EA77FF" text-anchor="middle">Pr</text>
    <text x="170" y="266" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#DADADF">Premiere</text>
    <text x="170" y="282" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#AFAFB5">vX.Y.Z</text>
    <rect x="122" y="290" width="150" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="197" y="305" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#92929A" text-anchor="middle">Debug Script</text>

    <!-- app card: InDesign -->
    <rect x="110" y="334" width="174" height="80" rx="10" fill="#34216E" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M118 352 L122 356 L126 352" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="342" width="26" height="26" rx="7" fill="#310015" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF3366" text-anchor="middle">Id</text>
    <text x="170" y="356" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#DADADF">InDesign</text>
    <text x="170" y="372" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#AFAFB5">vX.Y.Z</text>
    <rect x="122" y="380" width="150" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="197" y="395" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#92929A" text-anchor="middle">Debug Script</text>

    <!-- app card: Media Encoder -->
    <rect x="110" y="424" width="174" height="80" rx="10" fill="#34216E" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M118 442 L122 446 L126 442" fill="none" stroke="#8A8A90" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="134" y="432" width="26" height="26" rx="7" fill="#16003D" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="147" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9999FF" text-anchor="middle">Me</text>
    <text x="170" y="446" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#DADADF">Media Encoder</text>
    <text x="170" y="462" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#AFAFB5">vX.Y.Z</text>
    <rect x="122" y="470" width="150" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="197" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#92929A" text-anchor="middle">Debug Script</text>

    <!-- main empty state -->
    <g fill="#5E5E66">
      <rect x="498" y="214" width="8" height="18" rx="4"/>
      <rect x="515" y="214" width="8" height="18" rx="4"/>
      <rect x="486" y="230" width="48" height="34" rx="14"/>
      <rect x="505" y="262" width="8" height="22" rx="4"/>
    </g>
    <text x="510" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2F2F4" text-anchor="middle">Add Plugins to your Workspace</text>
    <text x="510" y="354" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#AFAFB5" text-anchor="middle">Load and debug your plugins in development.</text>

    <rect x="364" y="384" width="130" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="429" y="411" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EDECEF" text-anchor="middle">Add Plugin</text>
    <rect x="508" y="384" width="148" height="44" rx="22" fill="#2680EB"/>
    <text x="582" y="411" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create Plugin</text>
  </g>

  <!-- crisp frame -->
  <rect x="60" y="68" width="680" height="464" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  </g>
</svg>
