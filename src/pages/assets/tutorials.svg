<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="tu-title">
  <title id="tu-title">Build your first plugin</title>
  <rect x="8" y="8" width="80" height="80" rx="20" fill="#F4E7F6"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="19.5" fill="none" stroke="#E3C9EC" stroke-width="1"/>

  <!-- person (behind), single accent -->
  <g fill="#9B2FA0">
    <!-- shoulders -->
    <path d="M14 82 C14 64 28 58 48 58 C68 58 82 64 82 82 Z"/>
    <!-- neck -->
    <rect x="43.5" y="50" width="9" height="10"/>
    <!-- hair -->
    <path d="M34 35 C32 22 41 16 49 16 C58 16 64 23 62 32 C59 26 55 28 54 23 C49 29 42 23 39 28 C37 24 35 28 34 35 Z"/>
    <!-- ears -->
    <circle cx="35.5" cy="40" r="3.2"/>
    <circle cx="60.5" cy="40" r="3.2"/>
    <!-- head -->
    <path d="M36 34 C36 26 41 22 48 22 C55 22 60 26 60 34 C60 44 55 53 48 55 C41 53 36 44 36 34 Z"/>
  </g>

  <!-- glasses (light lenses, accent frames) -->
  <g fill="#F4E7F6" stroke="#9B2FA0" stroke-width="1.8">
    <rect x="38" y="37" width="8.5" height="7.5" rx="2"/>
    <rect x="49.5" y="37" width="8.5" height="7.5" rx="2"/>
  </g>
  <line x1="46.5" y1="40.5" x2="49.5" y2="40.5" stroke="#9B2FA0" stroke-width="1.8"/>

  <!-- laptop (front), light rim separates it from the person behind -->
  <rect x="23" y="56" width="50" height="24" rx="6" fill="#9B2FA0" stroke="#F4E7F6" stroke-width="2.5"/>

  <!-- code glyph + indicator dot on screen -->
  <g fill="none" stroke="#F4E7F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41 61 l-5 5 l5 5"/>
    <path d="M55 61 l5 5 l-5 5"/>
    <path d="M50 59 l-4 14"/>
  </g>
  <circle cx="48" cy="76" r="2" fill="#F4E7F6"/>
</svg>
